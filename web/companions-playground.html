<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compagnons : bac à sable</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14121f; color: #e7e4f5; font: 13px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 10px 16px; background: #1e1b2e; }
      label { display: flex; gap: 6px; align-items: center; }
      canvas { flex: 1; width: 100%; min-height: 0; }
    </style>
  </head>
  <body>
    <header>
      <label>Humeur
        <select id="mood">
          <option value="working">Au travail</option>
          <option value="idle">Repos</option>
          <option value="waiting">Attente</option>
          <option value="done">Terminé</option>
          <option value="error">Erreur</option>
        </select>
      </label>
      <label>Zoom <input id="zoom" type="range" min="1" max="3" step="0.1" value="1.6" /></label>
      <label>Taille <input id="size" type="range" min="24" max="90" step="2" value="48" /></label>
      <label><input id="moving" type="checkbox" /> Mouvement réel</label>
      <span>Les accessoires et gestes n'apparaissent qu'à l'humeur « Au travail ».</span>
    </header>
    <canvas id="stage"></canvas>
    <script type="module" src="/src/companions/playground.ts"></script>
  </body>
</html>
